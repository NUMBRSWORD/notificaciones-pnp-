# Sample workflow for building and deploying a Jekyll site to GitHub Pages
name: Deploy Jekyll with GitHub Pages dependencies preinstalled

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Pruebas de la lógica pura (lib/*.test.js) -- si fallan, no se construye ni
  # se despliega nada. Antes no había ningún gate: un cambio roto se publicaba
  # igual si nadie corría "npm test" a mano antes de subirlo.
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run tests
        run: npm test

  # Build job
  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  # Deployment job
  deploy:
    environment:
      name: github-pages
      # wretry.action envuelve las salidas del paso original en un solo
      # campo JSON en vez de exponerlas con su nombre de siempre -- hay que
      # desempacarlo con fromJSON() para seguir llegando a "page_url".
      url: ${{ fromJSON(steps.deployment.outputs.outputs).page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      # actions/deploy-pages falla de forma intermitente por hipos
      # transitorios de la API de GitHub Pages (visto en la práctica: el
      # mismo commit vuelve a desplegar bien en el siguiente intento, sin
      # cambiar nada). Reintenta automáticamente en vez de depender de que
      # alguien note el fallo y le dé "Re-run" a mano.
      - name: Deploy to GitHub Pages
        id: deployment
        uses: Wandalen/wretry.action@v3
        with:
          action: actions/deploy-pages@v5
          attempt_limit: 3
          attempt_delay: 15000
